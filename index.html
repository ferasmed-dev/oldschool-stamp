<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Old School">
<title>Old School Pub · Stamp Card</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="api.js"></script>
<style>
  :root{
    --bg:#16110d; --bg2:#211913; --paper:#f2e6cc; --paper2:#e6d6b2; --ink:#2a1d14;
    --amber:#e9a23b; --amber-d:#b8741c; --red:#a3311f; --muted:#a8957a; --line:#3a2d22;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--paper);font-family:"DM Sans",system-ui,sans-serif;min-height:100%}
  body{padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 28px);
       background:radial-gradient(120% 60% at 50% -10%,#3a2717 0%,var(--bg) 60%) fixed}
  .wrap{max-width:430px;margin:0 auto}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
  .brand small{display:block;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
  .brand h1{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:46px;line-height:.9;letter-spacing:.02em}
  .lang{background:none;border:1px solid var(--line);color:var(--paper);border-radius:999px;padding:6px 12px;
        font:500 13px "DM Sans";cursor:pointer}
  .demo{background:#3b2a12;border:1px dashed var(--amber-d);color:#f5d29a;font-size:13px;border-radius:10px;
        padding:9px 12px;margin-bottom:14px;line-height:1.4}
  .card{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 20px 20px;position:relative;
        box-shadow:0 18px 40px -18px #000,inset 0 0 0 1px #fff6;overflow:hidden}
  .card::before{content:"";position:absolute;inset:8px;border:1.5px dashed #2a1d1430;border-radius:12px;pointer-events:none}
  .card h2{font-family:"Bebas Neue";font-weight:400;font-size:30px;letter-spacing:.03em;line-height:1}
  .card p.sub{color:#6b5640;font-size:14px;margin-top:4px}
  label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px;color:#4a3626}
  input[type=text],input[type=tel],input[type=email]{width:100%;font:16px "DM Sans";padding:13px 14px;border-radius:11px;
        border:1.5px solid #c9b48c;background:#fbf5e8;color:var(--ink);outline:none}
  input:focus{border-color:var(--amber-d)}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13.5px;line-height:1.4;color:#4a3626;font-weight:400}
  .check input{width:20px;height:20px;margin-top:1px;accent-color:var(--red);flex:none}
  details{margin-top:10px;font-size:12.5px;color:#6b5640;line-height:1.45}
  summary{cursor:pointer;text-decoration:underline}
  details p{margin-top:6px}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:700 16px "DM Sans";cursor:pointer;
       margin-top:18px;background:var(--red);color:#fff4e0;letter-spacing:.01em}
  .btn:active{transform:translateY(1px)}
  .btn.amber{background:var(--amber);color:var(--ink)}
  .btn.ghost{background:none;border:1.5px solid var(--line);color:var(--paper)}
  .btn:disabled{opacity:.55}
  .hint{font-size:12.5px;color:#7a6449;margin-top:12px;text-align:center}
  .err{color:var(--red);font-size:13.5px;font-weight:700;margin-top:10px;min-height:1em}
  /* stamps */
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0 6px}
  .grid.n6{grid-template-columns:repeat(3,1fr)} .grid.n4{grid-template-columns:repeat(4,1fr)}
  .slot{aspect-ratio:1;border-radius:50%;border:2px dashed #b49d74;display:grid;place-items:center;position:relative;color:#b49d74;
        font:400 18px "Bebas Neue"}
  .slot.on{border:0;background:var(--red);color:#fff1d6;transform:rotate(var(--r,-8deg));
           box-shadow:inset 0 0 0 3px #a3311f,inset 0 0 0 5px #f2e6cc55}
  .slot.on svg{width:58%;height:58%}
  .slot.gift{border-color:var(--amber-d);color:var(--amber-d)}
  .slot.gift svg{width:55%;height:55%}
  .slot.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(2.2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(var(--r,-8deg));opacity:1}}
  .progress{font-size:15px;color:#4a3626;margin-top:12px}
  .progress b{color:var(--red)}
  .reward{background:var(--amber);color:var(--ink);border-radius:14px;padding:16px;margin-top:16px;text-align:center;
          animation:glow 1.6s ease-in-out infinite alternate}
  .reward strong{display:block;font:400 30px "Bebas Neue";letter-spacing:.03em}
  @keyframes glow{from{box-shadow:0 0 0 0 #e9a23b66}to{box-shadow:0 0 0 10px #e9a23b00}}
  .meta{display:flex;justify-content:space-between;font-size:12.5px;color:#7a6449;margin-top:16px;border-top:1px dashed #c9b48c;padding-top:12px}
  .below{margin-top:16px;font-size:13px;color:var(--muted);line-height:1.5;text-align:center}
  .below a{color:var(--muted)}
  .install{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;
           color:#d9c7a5;line-height:1.45}
  .hidden{display:none!important}
  /* PIN sheet */
  .sheet-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .sheet{background:var(--bg2);width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 18px);
         border-top:1px solid var(--line);animation:up .25s ease-out}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{font:400 26px "Bebas Neue";letter-spacing:.04em;text-align:center}
  .sheet p{color:var(--muted);font-size:13px;text-align:center;margin-top:2px}
  .dots{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
  .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
  .dots i.f{background:var(--amber);border-color:var(--amber)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .pad button{background:#2c2219;border:0;border-radius:14px;color:var(--paper);font:500 24px "DM Sans";padding:14px 0;cursor:pointer}
  .pad button:active{background:#3b2e22}
  .pad .ok{background:var(--amber);color:var(--ink);font-weight:700;font-size:18px}
  .sheet .err{text-align:center;color:#ff8a70}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--paper);color:var(--ink);
         padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 10px 30px #000a;z-index:20;
         animation:up .2s ease-out}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--amber);border-radius:50%;margin:60px auto;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(1turn)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><small data-t="tag">Stamp card</small><h1 id="barName">Old School Pub</h1></div>
    <button class="lang" id="langBtn">EN</button>
  </header>
  <div class="demo hidden" id="demoNote"></div>

  <div id="vLoading"><div class="spin"></div></div>

  <!-- JOIN -->
  <form class="card hidden" id="vJoin" novalidate>
    <h2 data-t="joinTitle"></h2>
    <p class="sub" id="joinSub"></p>
    <label for="fName" data-t="name"></label>
    <input id="fName" type="text" autocomplete="given-name" maxlength="40" required>
    <label for="fContact" data-t="contact"></label>
    <input id="fContact" type="text" inputmode="email" autocomplete="tel" maxlength="80" required>
    <label class="check"><input type="checkbox" id="fConsent"><span data-t="consent"></span></label>
    <label class="check"><input type="checkbox" id="fMkt"><span data-t="marketing"></span></label>
    <details><summary data-t="privacyTitle"></summary><p data-t="privacy"></p></details>
    <div class="err" id="joinErr"></div>
    <button class="btn" type="submit" id="joinBtn" data-t="joinBtn"></button>
    <p class="hint" data-t="lost"></p>
  </form>

  <!-- CARD -->
  <section class="hidden" id="vCard">
    <div class="card">
      <h2 id="hello"></h2>
      <p class="sub" id="rule"></p>
      <div class="grid" id="grid"></div>
      <p class="progress" id="progress"></p>
      <div class="reward hidden" id="reward"><strong id="rewardTitle"></strong><span data-t="showStaff"></span></div>
      <div class="meta"><span id="earned"></span><span id="cardId"></span></div>
    </div>
    <button class="btn amber" id="stampBtn" data-t="stampBtn"></button>
    <button class="btn hidden" id="redeemBtn" data-t="redeemBtn"></button>
    <div class="install hidden" id="install"></div>
    <p class="below"><a href="#" id="switchCard" data-t="notYou"></a></p>
  </section>
  <p class="below hidden" id="ownerLink"><a href="owner.html">Demo: panel del dueño / owner page →</a></p>
</div>

<!-- PIN SHEET -->
<div class="sheet-bg hidden" id="sheet">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="sheetTitle"></h3>
    <p data-t="staffOnly"></p>
    <div class="dots" id="dots"></div>
    <div class="err" id="pinErr"></div>
    <div class="pad" id="pad"></div>
    <button class="btn ghost" id="sheetCancel" data-t="cancel" style="margin-top:12px"></button>
  </div>
</div>

<script>
const T = {
  es:{tag:"Tarjeta de sellos",joinTitle:"Consigue tu tarjeta",joinSub:"{n} sellos = {r}. Un sello por visita.",
      name:"Tu nombre",contact:"Móvil o email",
      consent:"Acepto que {bar} guarde mi nombre y contacto para gestionar mi tarjeta de sellos.",
      marketing:"Quiero recibir ofertas y eventos de estudiantes (opcional).",
      privacyTitle:"Privacidad",privacy:"Solo guardamos tu nombre, tu contacto y tus visitas, para que la tarjeta funcione. Tu contacto solo se usa para ofertas si marcas la segunda casilla. Puedes pedir que borremos tus datos en la barra en cualquier momento.",
      joinBtn:"Crear mi tarjeta",lost:"¿Ya tenías tarjeta en otro móvil? Pon el mismo móvil o email y la recuperamos.",
      hello:"Hola, {name}",rule:"{n} sellos = {r}",left1:"Te falta <b>1</b> sello para tu premio.",leftN:"Te faltan <b>{k}</b> sellos para tu premio.",
      full:"¡Tarjeta completa!",showStaff:"Enséñaselo al camarero para canjearlo.",earned:"Premios conseguidos: {k}",
      stampBtn:"Camarero: añadir sello",redeemBtn:"Camarero: canjear premio",notYou:"¿No eres tú? Cambiar de tarjeta",
      staffOnly:"Solo personal: introduce el PIN",cancel:"Cancelar",sheetStamp:"Añadir sello",sheetRedeem:"Canjear premio",
      stamped:"¡Sello añadido!",redeemed:"¡Premio canjeado! Tarjeta nueva 🍺",
      e_bad_pin:"PIN incorrecto",e_locked:"Demasiados intentos. Espera 10 minutos.",e_cooldown:"Ya tienes sello de esta visita. Vuelve en {m} min.",
      e_full:"La tarjeta está completa: canjea el premio primero.",e_not_ready:"Aún no hay premio para canjear.",e_not_found:"No encontramos esta tarjeta.",
      e_network:"Sin conexión. Inténtalo de nuevo.",e_consent:"Marca la casilla de consentimiento para continuar.",e_contact:"Escribe un móvil o email válido.",
      e_name:"Escribe tu nombre.",e_no_bar:"Este local no está configurado.",
      demo:"MODO DEMO: los datos solo se guardan en este móvil. PIN de camarero: 1234.",
      iosInstall:"📲 Guárdala como app: pulsa <b>Compartir</b> y luego <b>Añadir a pantalla de inicio</b>.",
      andInstall:"📲 Guárdala como app: menú <b>⋮</b> → <b>Añadir a pantalla de inicio</b>."},
  en:{tag:"Stamp card",joinTitle:"Get your card",joinSub:"{n} stamps = {r}. One stamp per visit.",
      name:"Your name",contact:"Phone or email",
      consent:"I agree that {bar} stores my name and contact to run my stamp card.",
      marketing:"Send me student offers and events (optional).",
      privacyTitle:"Privacy",privacy:"We only store your name, contact and visits so the card works. Your contact is only used for offers if you tick the second box. You can ask at the bar to delete your data at any time.",
      joinBtn:"Create my card",lost:"Had a card on another phone? Enter the same phone or email and we'll find it.",
      hello:"Hi, {name}",rule:"{n} stamps = {r}",left1:"<b>1</b> more stamp for your reward.",leftN:"<b>{k}</b> more stamps for your reward.",
      full:"Card complete!",showStaff:"Show this to the staff to claim it.",earned:"Rewards earned: {k}",
      stampBtn:"Staff: add stamp",redeemBtn:"Staff: claim reward",notYou:"Not you? Switch card",
      staffOnly:"Staff only: enter PIN",cancel:"Cancel",sheetStamp:"Add stamp",sheetRedeem:"Claim reward",
      stamped:"Stamp added!",redeemed:"Reward claimed! Fresh card 🍺",
      e_bad_pin:"Wrong PIN",e_locked:"Too many tries. Wait 10 minutes.",e_cooldown:"Already stamped this visit. Come back in {m} min.",
      e_full:"Card is full: claim the reward first.",e_not_ready:"No reward to claim yet.",e_not_found:"Card not found.",
      e_network:"No connection. Try again.",e_consent:"Tick the consent box to continue.",e_contact:"Enter a valid phone or email.",
      e_name:"Enter your name.",e_no_bar:"This venue isn't set up.",
      demo:"DEMO MODE: data is only saved on this phone. Staff PIN: 1234.",
      iosInstall:"📲 Save it as an app: tap <b>Share</b>, then <b>Add to Home Screen</b>.",
      andInstall:"📲 Save it as an app: menu <b>⋮</b> → <b>Add to Home screen</b>."}
};
const $ = id => document.getElementById(id);
const S = API.store;
const params = new URLSearchParams(location.search);
const BAR = (params.get("bar") || (window.STAMP_CONFIG||{}).DEFAULT_BAR || "old-school").toLowerCase();
const KEY = "stampcard:" + BAR;
let lang = S.get("stampcard:lang") || ((navigator.language||"").toLowerCase().startsWith("es") ? "es" : "en");
let bar = {name:"Old School Pub", reward:"Jarra gratis", stamps_needed:5};
let card = null, pinMode = "stamp", pin = "", busy = false;

const fmt = (s, v={}) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");
const t = (k, v) => fmt(T[lang][k] || k, v);
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function applyLang(){
  document.documentElement.lang = lang;
  $("langBtn").textContent = lang === "es" ? "EN" : "ES";
  document.querySelectorAll("[data-t]").forEach(el => {
    const k = el.dataset.t; el.innerHTML = t(k, {bar: esc(bar.name)});
  });
  $("joinSub").textContent = t("joinSub", {n: bar.stamps_needed, r: bar.reward});
  $("barName").textContent = bar.name;
  if (API.demo){ $("demoNote").textContent = t("demo"); $("demoNote").classList.remove("hidden"); $("ownerLink").classList.remove("hidden"); }
  if (card) renderCard(false);
  renderInstall();
}
$("langBtn").onclick = () => { lang = lang === "es" ? "en" : "es"; S.set("stampcard:lang", lang); applyLang(); };

function show(v){ ["vLoading","vJoin","vCard"].forEach(id => $(id).classList.toggle("hidden", id !== v)); }
function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2400); }
function errText(r){ return t("e_" + (r.error || "network"), {m: r.minutes_left}); }

const MUG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h10v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8Z"/><path d="M15 10h2.5a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H15"/><path d="M5 8c0-2 1.5-3 3-3 .5-1.2 1.6-2 3-2s2.6.9 3 2c1.4 0 1 3 1 3"/><path d="M9 12v5M12 12v5"/></svg>';
const GIFT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M12 8v13M12 8S10.5 3 8 3a2.5 2.5 0 0 0 0 5M12 8s1.5-5 4-5a2.5 2.5 0 0 1 0 5"/></svg>';

function renderCard(animateNew){
  const n = card.stamps_needed, k = card.stamps;
  $("hello").textContent = t("hello", {name: card.name});
  $("rule").textContent = t("rule", {n, r: card.reward});
  const g = $("grid"); g.className = "grid" + (n===6||n===9 ? " n6" : n===4||n===8 ? " n4" : "");
  g.innerHTML = "";
  for (let i = 0; i < n; i++){
    const s = document.createElement("div");
    s.className = "slot";
    s.style.setProperty("--r", (((i*37)%23)-11) + "deg");
    if (i < k){ s.classList.add("on"); s.innerHTML = MUG; if (animateNew && i === k-1) s.classList.add("pop"); }
    else if (i === n-1){ s.classList.add("gift"); s.innerHTML = GIFT; }
    else s.textContent = i+1;
    g.appendChild(s);
  }
  const left = n - k, full = left <= 0;
  $("progress").innerHTML = full ? "" : (left === 1 ? t("left1") : t("leftN", {k: left}));
  $("reward").classList.toggle("hidden", !full);
  $("rewardTitle").textContent = t("full") + " " + card.reward;
  $("stampBtn").classList.toggle("hidden", full);
  $("redeemBtn").classList.toggle("hidden", !full);
  $("earned").textContent = t("earned", {k: card.rewards_redeemed});
  $("cardId").textContent = "#" + String(card.id).replace(/-/g,"").slice(-6).toUpperCase();
}

function renderInstall(){
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), android = /android/i.test(navigator.userAgent);
  const el = $("install");
  if (standalone || !(ios || android)){ el.classList.add("hidden"); return; }
  el.innerHTML = ios ? t("iosInstall") : t("andInstall"); el.classList.remove("hidden");
}

// ---- join ----
$("vJoin").addEventListener("submit", async e => {
  e.preventDefault(); if (busy) return;
  $("joinErr").textContent = "";
  if (!$("fName").value.trim()) return $("joinErr").textContent = t("e_name");
  if (!$("fConsent").checked) return $("joinErr").textContent = t("e_consent");
  busy = true; $("joinBtn").disabled = true;
  const r = await API.call("join_card", {p_bar: BAR, p_name: $("fName").value, p_contact: $("fContact").value,
                                         p_consent: true, p_marketing: $("fMkt").checked});
  busy = false; $("joinBtn").disabled = false;
  if (!r.ok) return $("joinErr").textContent = errText(r);
  card = r.card; S.set(KEY, card.id); renderCard(false); show("vCard");
});

// ---- PIN sheet ----
function openSheet(mode){
  pinMode = mode; pin = ""; $("pinErr").textContent = "";
  $("sheetTitle").textContent = t(mode === "stamp" ? "sheetStamp" : "sheetRedeem");
  drawDots(); $("sheet").classList.remove("hidden");
}
function closeSheet(){ $("sheet").classList.add("hidden"); }
function drawDots(){ $("dots").innerHTML = Array.from({length: Math.max(4, pin.length)}, (_, i) => `<i class="${i < pin.length ? "f" : ""}"></i>`).join(""); }
["1","2","3","4","5","6","7","8","9","⌫","0","OK"].forEach(k => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = k;
  if (k === "OK") b.className = "ok";
  b.onclick = () => {
    if (k === "⌫") pin = pin.slice(0, -1);
    else if (k === "OK") return submitPin();
    else if (pin.length < 6) pin += k;
    $("pinErr").textContent = ""; drawDots();
  };
  $("pad").appendChild(b);
});
async function submitPin(){
  if (busy || pin.length < 4) return;
  busy = true;
  const r = await API.call(pinMode === "stamp" ? "add_stamp" : "redeem", {p_card: card.id, p_pin: pin});
  busy = false;
  if (!r.ok){
    pin = ""; drawDots(); $("pinErr").textContent = errText(r);
    if (r.card){ card = r.card; renderCard(false); }
    return;
  }
  card = r.card; closeSheet(); renderCard(pinMode === "stamp");
  toast(t(pinMode === "stamp" ? "stamped" : "redeemed"));
  if (navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
}
$("stampBtn").onclick = () => openSheet("stamp");
$("redeemBtn").onclick = () => openSheet("redeem");
$("sheetCancel").onclick = closeSheet;
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
$("switchCard").onclick = e => { e.preventDefault(); S.del(KEY); card = null; show("vJoin"); };

// ---- start ----
async function refresh(){
  const id = S.get(KEY); if (!id) return;
  const r = await API.call("get_card", {p_card: id});
  if (r.ok){ card = r.card; renderCard(false); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && card) refresh(); });

(async function init(){
  applyLang();
  const b = await API.call("bar_info", {p_bar: BAR});
  if (b.ok){ bar = b; applyLang(); }
  const id = S.get(KEY);
  if (id){
    const r = await API.call("get_card", {p_card: id});
    if (r.ok){ card = r.card; renderCard(false); show("vCard"); return; }
    if (r.error === "not_found") S.del(KEY);
  }
  show("vJoin");
})();
</script>
</body>
</html>
